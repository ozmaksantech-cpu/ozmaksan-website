name: Update content catalog

# CMS Publish sonrası katalog güncelle — Netlify/CF deploy YOK
on:
  push:
    branches: [main]
    paths:
      - "content/products/**"
      - "content/news/**"
      - "content/site.json"

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write catalog
        run: node _build/write-catalog.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/catalog.json
          if git diff --staged --quiet; then
            echo "catalog unchanged"
            exit 0
          fi
          git commit -m "chore: refresh content catalog"
          git push
