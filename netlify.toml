[build]
  # CMS içerik kaydı = deploy YOK (kredi yakmaz). Sadece kod değişince build.
  command = "node _build/write-catalog.mjs && node _build/build-all.mjs"
  publish = "."
  ignore = "bash _build/should-build.sh"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

# Dil klasörleri
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/ru"
  to = "/ru/index.html"
  status = 200

[[redirects]]
  from = "/ar"
  to = "/ar/index.html"
  status = 200

# Kaldırılan/birleştirilen ürün sayfaları
[[redirects]]
  from = "/urun-ekonomizer-rekuperatorler"
  to = "/urun-ekonomizer"
  status = 301

[[redirects]]
  from = "/:lang/urun-ekonomizer-rekuperatorler"
  to = "/:lang/urun-ekonomizer"
  status = 301

[[redirects]]
  from = "/urun-enerji-geri-kazanim"
  to = "/urunler"
  status = 301

[[redirects]]
  from = "/:lang/urun-enerji-geri-kazanim"
  to = "/:lang/urunler"
  status = 301

[[redirects]]
  from = "/urun-ekonomizer-rekuperatorler.html"
  to = "/urun-ekonomizer"
  status = 301

[[redirects]]
  from = "/:lang/urun-ekonomizer-rekuperatorler.html"
  to = "/:lang/urun-ekonomizer"
  status = 301

[[redirects]]
  from = "/urun-enerji-geri-kazanim.html"
  to = "/urunler"
  status = 301

[[redirects]]
  from = "/:lang/urun-enerji-geri-kazanim.html"
  to = "/:lang/urunler"
  status = 301

# Decap CMS SPA
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/catalogs/*"
  [headers.values]
    Content-Type = "application/pdf"

[[headers]]
  for = "/assets/media/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/mp4"

[[headers]]
  for = "/assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex"
    Cache-Control = "no-cache, no-store, must-revalidate"
