[build]
  # CMS içerik kaydı = deploy YOK (kredi yakmaz). Sadece kod değişince build.
  command = "node _build/write-catalog.mjs && node _build/build-all.mjs"
  publish = "."
  ignore = "bash _build/should-build.sh"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

# Dil klasörleri
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/ru"
  to = "/ru/index.html"
  status = 200

[[redirects]]
  from = "/ar"
  to = "/ar/index.html"
  status = 200

